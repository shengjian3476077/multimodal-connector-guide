<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 42px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .card-title { font: 700 28px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 21px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1e293b; }
      .small { font: 400 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .tag { font: 600 17px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .box { stroke-width: 2; rx: 14; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text x="80" y="72" class="title">多模态大模型连接器：四种常见构件</text>
  <text x="80" y="112" class="subtitle">四个名称描述不同设计轴，可组合使用；M 表示输出视觉 token 数。</text>

  <rect x="80" y="150" width="1440" height="120" rx="22" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <rect x="120" y="178" width="260" height="64" class="box" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="250" y="218" text-anchor="middle" class="label">视觉编码器 X∈Rᴺˣᵈᵛ</text>
  <path d="M390 210 H620" class="arrow"/>
  <rect x="630" y="178" width="300" height="64" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="780" y="218" text-anchor="middle" class="label">连接器 P(X)</text>
  <path d="M940 210 H1170" class="arrow"/>
  <rect x="1180" y="178" width="300" height="64" class="box" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1330" y="218" text-anchor="middle" class="label">LLM 输入 Z∈Rᴹˣᵈˡ</text>

  <!-- MLP -->
  <rect x="80" y="305" width="1440" height="160" rx="22" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
  <text x="110" y="350" class="card-title">1. MLP</text>
  <rect x="295" y="330" width="150" height="54" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="370" y="365" text-anchor="middle" class="label">Linear</text>
  <path d="M455 357 H540" class="arrow"/>
  <rect x="550" y="330" width="150" height="54" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="365" text-anchor="middle" class="label">GELU</text>
  <path d="M710 357 H795" class="arrow"/>
  <rect x="805" y="330" width="150" height="54" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="880" y="365" text-anchor="middle" class="label">Linear</text>
  <rect x="1040" y="330" width="170" height="40" rx="20" fill="#e0e7ff"/>
  <text x="1125" y="357" text-anchor="middle" class="tag">逐 token 映射</text>
  <rect x="1225" y="330" width="130" height="40" rx="20" fill="#f1f5f9"/>
  <text x="1290" y="357" text-anchor="middle" class="tag">M=N</text>
  <text x="295" y="422" class="small">作用：维度与语义空间投影；优点：简单、吞吐高；限制：不压缩视觉序列。</text>

  <!-- LN + MLP -->
  <rect x="80" y="490" width="1440" height="160" rx="22" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
  <text x="110" y="535" class="card-title">2. LN + MLP</text>
  <rect x="295" y="515" width="140" height="54" class="box" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="365" y="550" text-anchor="middle" class="label">LayerNorm</text>
  <path d="M445 542 H530" class="arrow"/>
  <rect x="540" y="515" width="180" height="54" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="630" y="550" text-anchor="middle" class="label">可选 2×2 拼接</text>
  <path d="M730 542 H815" class="arrow"/>
  <rect x="825" y="515" width="200" height="54" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="925" y="550" text-anchor="middle" class="label">2-layer MLP</text>
  <rect x="1095" y="515" width="210" height="40" rx="20" fill="#cffafe"/>
  <text x="1200" y="542" text-anchor="middle" class="tag">稳定输入尺度</text>
  <rect x="1320" y="515" width="150" height="40" rx="20" fill="#f1f5f9"/>
  <text x="1395" y="542" text-anchor="middle" class="tag">M=N 或 N/4</text>
  <text x="295" y="607" class="small">LayerNorm 本身不改变 token 数；只有与局部拼接/池化组合时才压缩序列。</text>

  <!-- Gated MLP -->
  <rect x="80" y="675" width="1440" height="190" rx="22" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
  <text x="110" y="720" class="card-title">3. Gated MLP（以 SwiGLU 为例）</text>
  <circle cx="325" cy="772" r="24" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="325" y="780" text-anchor="middle" class="label">X</text>
  <path d="M350 762 C430 720, 470 720, 540 732" class="arrow"/>
  <path d="M350 782 C430 824, 470 824, 540 812" class="arrow"/>
  <rect x="550" y="705" width="170" height="54" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="635" y="740" text-anchor="middle" class="label">SiLU(WgX)</text>
  <rect x="550" y="785" width="170" height="54" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="635" y="820" text-anchor="middle" class="label">WvX</text>
  <path d="M730 732 C790 732, 800 756, 835 770" class="arrow"/>
  <path d="M730 812 C790 812, 800 788, 835 774" class="arrow"/>
  <circle cx="865" cy="772" r="30" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="865" y="781" text-anchor="middle" class="card-title">×</text>
  <path d="M900 772 H995" class="arrow"/>
  <rect x="1005" y="745" width="150" height="54" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1080" y="780" text-anchor="middle" class="label">Wo</text>
  <rect x="1200" y="735" width="190" height="40" rx="20" fill="#dcfce7"/>
  <text x="1295" y="762" text-anchor="middle" class="tag">通道级选择性</text>
  <rect x="1200" y="790" width="190" height="40" rx="20" fill="#f1f5f9"/>
  <text x="1295" y="817" text-anchor="middle" class="tag">单独使用 M=N</text>
  <text x="295" y="845" class="small">表达力高于普通 MLP，但参数量、激活显存与计算更大；常与 token 合并组合。</text>

  <!-- Token Pooling -->
  <rect x="80" y="890" width="1440" height="160" rx="22" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
  <text x="110" y="935" class="card-title">4. Token Pooling</text>
  <g transform="translate(305,915)">
    <g fill="#dbeafe" stroke="#60a5fa">
      <rect x="0" y="0" width="34" height="34"/><rect x="38" y="0" width="34" height="34"/><rect x="76" y="0" width="34" height="34"/><rect x="114" y="0" width="34" height="34"/>
      <rect x="0" y="38" width="34" height="34"/><rect x="38" y="38" width="34" height="34"/><rect x="76" y="38" width="34" height="34"/><rect x="114" y="38" width="34" height="34"/>
      <rect x="0" y="76" width="34" height="34"/><rect x="38" y="76" width="34" height="34"/><rect x="76" y="76" width="34" height="34"/><rect x="114" y="76" width="34" height="34"/>
    </g>
  </g>
  <path d="M480 970 H590" class="arrow"/>
  <rect x="600" y="935" width="240" height="70" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="720" y="965" text-anchor="middle" class="label">Avg / Max / Attention</text>
  <text x="720" y="992" text-anchor="middle" class="small">局部或全局聚合</text>
  <path d="M850 970 H960" class="arrow"/>
  <g transform="translate(975,938)" fill="#dcfce7" stroke="#22c55e">
    <rect x="0" y="0" width="55" height="55"/><rect x="65" y="0" width="55" height="55"/><rect x="130" y="0" width="55" height="55"/>
  </g>
  <rect x="1210" y="925" width="230" height="40" rx="20" fill="#ffedd5"/>
  <text x="1325" y="952" text-anchor="middle" class="tag">核心目标：M&lt;N</text>
  <rect x="1210" y="980" width="230" height="40" rx="20" fill="#fee2e2"/>
  <text x="1325" y="1007" text-anchor="middle" class="tag">风险：细节与空间信息损失</text>

  <text x="800" y="1090" text-anchor="middle" class="subtitle">组合示例：Qwen2-VL = LN + 2×2 token 拼接 + MLP；Aya Vision = token 重排 + LN + SwiGLU。</text>
</svg>
